name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - feature/correcoes-arquiteturais

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-test-public-key-not-a-secret
      NEXT_PUBLIC_SUPABASE_URL: https://ci-test.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-test-service-role-not-a-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:check

      - name: Check secrets
        run: npm run secrets:check

      - name: Check secrets in proposed commits
        if: github.event_name == 'pull_request'
        run: npm run secrets:check -- --git-range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Check secrets in pushed commits
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: npm run secrets:check -- --git-range "${{ github.event.before }}..${{ github.event.after }}"

      - name: Check database drift
        run: npm run db:drift:check

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Enforce lint gate (zero-tolerance)
        run: npm run lint:ratchet

      - name: Enforce AI slop gate
        run: npm run aislop

      - name: Enforce module boundaries
        run: npm run boundaries:check

      - name: Build production bundle
        run: npm run build

      - name: Check build artifact allowlist
        run: npm run build:artifact:check

  database-lab:
    name: Disposable Supabase database lab
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run disposable database lab
        run: npm run test:db
