# Chatwoot CE de desenvolvimento (MSG-001). Só laboratório: dados sintéticos e nenhum segredo real.
# Versão e digests fixos; subir de versão exige repetir `npm run test:chatwoot` (issue #13809).
# Postgres e Redis são exclusivos do Chatwoot e não publicam porta no host.
name: orbita-chatwoot-dev

x-chatwoot: &chatwoot
  image: chatwoot/chatwoot:v4.19.1@sha256:a0d571a3a2f78f4fa4b1d7c21a53309c0184068d6021b3664ab37788faef04c1
  environment: &ambiente
    NODE_ENV: production
    RAILS_ENV: production
    INSTALLATION_ENV: docker
    SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:?defina em infra/chatwoot-dev/.env}
    FRONTEND_URL: http://127.0.0.1:${CHATWOOT_DEV_PORT:-3100}
    ENABLE_ACCOUNT_SIGNUP: 'false'
    POSTGRES_HOST: postgres
    POSTGRES_USERNAME: postgres
    POSTGRES_PASSWORD: ${CHATWOOT_POSTGRES_PASSWORD:?defina em infra/chatwoot-dev/.env}
    POSTGRES_DATABASE: chatwoot
    REDIS_URL: redis://redis:6379
    REDIS_PASSWORD: ${CHATWOOT_REDIS_PASSWORD:?defina em infra/chatwoot-dev/.env}
    ACTIVE_STORAGE_SERVICE: local
    # Só neste laboratório: o webhook sai para um receptor na própria máquina.
    SAFE_FETCH_ALLOW_PRIVATE_NETWORK: 'true'
  volumes:
    - storage:/app/storage
  extra_hosts:
    - host.docker.internal:host-gateway

services:
  rails:
    <<: *chatwoot
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - 127.0.0.1:${CHATWOOT_DEV_PORT:-3100}:3000
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']

  sidekiq:
    <<: *chatwoot
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  postgres:
    image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CHATWOOT_POSTGRES_PASSWORD:?defina em infra/chatwoot-dev/.env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d chatwoot']
      interval: 3s
      timeout: 3s
      retries: 40

  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    environment:
      REDISCLI_AUTH: ${CHATWOOT_REDIS_PASSWORD:?defina em infra/chatwoot-dev/.env}
    command: ['sh', '-c', 'exec redis-server --requirepass "$$REDISCLI_AUTH"']
    volumes:
      - redis:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  storage:
  postgres:
  redis:
