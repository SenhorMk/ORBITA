# Workers da mensageria em um host (MSG-020A). Rodar da raiz do repositório:
#   docker compose -f infra/worker/docker-compose.yml up -d --build
# Segredos em infra/worker/.env (fora do Git; modelo em .env.example ao lado).
# Os dois kill switches começam desligados: os containers ficam de pé, parados.
name: orbita-workers

x-worker: &worker
  build:
    context: ../..
    dockerfile: infra/worker/Dockerfile
  image: orbita-worker:local
  env_file: .env
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  # Maior que um envio em curso (timeout do provedor de 10 s), para a parada terminá-lo.
  stop_grace_period: 30s
  mem_limit: 256m
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '5' }

services:
  inbox:
    <<: *worker
    command: ['inbox']

  envio:
    <<: *worker
    command: ['envio']
